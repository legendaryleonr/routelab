[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "routelab"
version = "0.1.0"
description = "Classify banking support messages and route them to a team or a human review queue"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Leon Ren" }]
# Every package the code imports directly, with compatible ranges.
# Exact, tested versions are pinned in requirements.txt.
dependencies = [
    "certifi>=2026.10.18",
    "fastapi>=0.165,<0.166",
    "jinja2>=3.1,<4",
    "joblib>=1.6,<1.7",
    "numpy>=2.5,<2.6",
    "pydantic>=2.13,<3",
    "python-multipart>=0.0.32,<0.1",
    "scikit-learn>=1.9,<1.10",
    "starlette>=1.7,<2",
    "uvicorn>=0.54,<0.55",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13,<3",
    "matplotlib>=3.11,<3.12",
    "pytest>=9.1,<10",
]

[project.scripts]
routelab = "routelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
routelab = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
